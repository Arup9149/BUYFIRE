<head>

<title>BUYFIRE — The AI Commerce Agent That Knows When It Doesn't Know</title>

<style>
:root{
  --bg:#05080f;
  --text:#f4f8fb;
  --muted:#9aa7b8;
  --dim:#6b7789;
  --teal:#2ee6c8;
  --cyan:#56d4ff;
  --amber:#f5b942;
  --green:#3ee6a8;
  --danger:#ff6b80;
  --ink:#041510;
  --glass:rgba(255,255,255,.045);
  --stroke:rgba(180,220,255,.14);
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{
  background:
    radial-gradient(1200px 700px at 82% -12%, rgba(46,230,200,.14), transparent 58%),
    radial-gradient(900px 560px at 100% 12%, rgba(40,120,220,.20), transparent 55%),
    radial-gradient(720px 480px at 8% 28%, rgba(86,212,255,.06), transparent 52%),
    radial-gradient(800px 500px at -8% 78%, rgba(46,230,200,.05), transparent 50%),
    linear-gradient(180deg,#07111c 0%,#05080f 42%,#04070c 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(118deg, transparent 0 46px, rgba(86,212,255,.025) 46px 47px),
    linear-gradient(118deg, transparent 20%, rgba(46,230,200,.05) 48%, transparent 72%);
  opacity:.7;
}
button{font-family:inherit}
.shell{position:relative;z-index:1}
.nav-wrap{position:sticky;top:0;z-index:40;padding:12px 28px 0}
.navbar{
  max-width:1400px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:8px 10px 8px 14px;border-radius:999px;
  background:rgba(8,16,28,.58);border:1px solid var(--stroke);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex-shrink:0}
.brand-name{font-weight:800;letter-spacing:.12em;font-size:13px}
.brand-tag{display:block;font-size:8px;letter-spacing:.16em;color:var(--dim);font-weight:600;margin-top:2px}
.nav-toggle{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);color:var(--text);cursor:pointer}
.nav{display:flex;flex-wrap:nowrap;justify-content:center;gap:2px}
.nav button{
  padding:7px 10px;border-radius:999px;border:none;background:transparent;color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
  transition:background .22s ease,color .22s ease
}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav button.active{
  color:var(--teal);background:rgba(46,230,200,.12);border:1px solid rgba(46,230,200,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1)
}
.nav-meta{
  justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  padding:7px 12px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.03)
}
.nav-meta .ready{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.1em}
.nav-meta .mode{font-size:8px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(62,230,168,.14);animation:pulse 2.4s ease-in-out infinite}
.dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(245,185,66,.14)}
.dot.danger{background:var(--danger);box-shadow:0 0 0 4px rgba(255,107,128,.14)}
.dot.idle{animation:none}
.main{max-width:1400px;margin:0 auto;padding:16px 32px 56px}
.hero-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr);gap:48px;align-items:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px
}
h1{font-size:clamp(30px,3.6vw,52px);font-weight:800;letter-spacing:-.045em;line-height:1.04;margin-bottom:12px}
h1 .em{color:var(--teal)}
.lede{color:var(--muted);max-width:520px;font-size:15px;margin-bottom:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:14px;
  font-weight:700;font-size:13px;letter-spacing:.04em;border:none;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,#5ff3d4,var(--teal));color:var(--ink);box-shadow:0 12px 30px rgba(46,230,200,.28)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--text);backdrop-filter:blur(16px)}
.btn-danger{background:rgba(255,107,128,.14);border:1px solid rgba(255,107,128,.4);color:#ffd5db}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.trust{margin-top:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700}
.engine{
  padding:18px 20px 16px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
  border:1px solid var(--stroke);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.1)
}
.engine-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.engine-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.engine-path{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:700}
.stages{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.stage{flex:1;text-align:center;min-width:0}
.ico{
  width:54px;height:54px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;
  border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--teal)
}
.stage.unknown-stage .ico{
  border-color:rgba(245,185,66,.7);background:rgba(245,185,66,.1);
  box-shadow:0 0 0 1px rgba(245,185,66,.2), 0 0 28px rgba(245,185,66,.28);color:var(--amber)
}
.stage strong{display:block;font-size:10px;letter-spacing:.08em}
.stage em{display:block;margin-top:4px;font-style:normal;font-size:11px;color:var(--muted)}
.stage.unknown-stage em{color:var(--amber);font-weight:800;letter-spacing:.08em}
.arr{align-self:center;color:var(--teal);opacity:.7;font-size:16px;margin-top:16px;flex:0 0 14px}
.triad{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.chip-s{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--stroke);font-size:11px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.03)
}
.chip-s.u{color:var(--amber);border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.08)}
.chip-s.g{color:var(--cyan);border-color:rgba(86,212,255,.35);background:rgba(86,212,255,.08)}
.chip-s.v{color:var(--green);border-color:rgba(62,230,168,.35);background:rgba(62,230,168,.08)}
.engine-note{text-align:center;margin-top:10px;font-size:12px;color:var(--muted)}
.status-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0 12px;
  border-radius:22px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden
}
.status-cell{padding:14px 18px;border-right:1px solid var(--stroke)}
.status-cell:last-child{border-right:none}
.status-cell .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.status-cell .v{margin-top:8px;font-size:18px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.status-cell .d{margin-top:4px;font-size:12px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.feat{padding:16px;border-radius:18px;border:1px solid transparent}
.feat strong{display:block;font-size:11px;letter-spacing:.1em;margin-bottom:6px}
.feat span{color:var(--muted);font-size:13px}
.page-foot{display:flex;justify-content:space-between;gap:16px;margin-top:28px;color:var(--dim);font-size:11px;letter-spacing:.12em;font-weight:700}
.card{
  background:rgba(255,255,255,.045);border:1px solid var(--stroke);border-radius:20px;padding:22px;
  backdrop-filter:blur(20px);box-shadow:0 16px 40px rgba(0,0,0,.28)
}
.card-title{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mission{font-size:17px;padding:16px 18px;border:1px solid rgba(46,230,200,.18);background:rgba(46,230,200,.05);border-radius:16px;margin:14px 0}
.state-rail,.stage-rail{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip,.stn{
  padding:8px 12px;border-radius:10px;border:1px solid var(--stroke);font-family:var(--mono);
  font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.03)
}
.chip.done,.stn.on{border-color:rgba(46,230,200,.35);color:var(--teal);background:rgba(46,230,200,.08)}
.chip.blocked,.stn.halt{border-color:rgba(255,107,128,.4);color:var(--danger);background:rgba(255,107,128,.1)}
.chip.active,.stn.wait{border-color:rgba(245,185,66,.4);color:var(--amber)}
.alert{padding:16px 18px;border-radius:16px;border:1px solid rgba(255,107,128,.35);background:rgba(255,107,128,.08);margin:12px 0}
.alert .t{font-weight:700;color:var(--danger);margin-bottom:4px;letter-spacing:.06em}
.intercept{text-align:center;padding:8px 0 12px}
.intercept .big{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;color:var(--danger)}
.intercept .field{margin-top:16px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.intercept .unknown{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:.08em;color:var(--amber);margin-top:6px}
.intercept p{max-width:560px;margin:16px auto 0;color:var(--muted)}
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.ev-box{padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--stroke)}
.ev-box .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.ev-box .v{margin-top:6px;font-weight:700;font-size:13px}
.sim{padding:12px 16px;border-radius:14px;background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:var(--amber);font-weight:700;font-size:12px;text-align:center;margin:12px 0;letter-spacing:.08em}
.sim.ok{background:rgba(46,230,200,.1);border-color:rgba(46,230,200,.35);color:var(--teal)}
.sim.xl{font-size:15px;padding:16px;letter-spacing:.12em}
.ev{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);margin:6px 0;font-size:13px}
.ev.match{border-color:rgba(46,230,200,.25)}
.ev.blocked{border-color:rgba(255,107,128,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--stroke)}
td{padding:12px 8px;border-bottom:1px solid var(--stroke);vertical-align:top}
.badge-g{background:rgba(46,230,200,.15);color:var(--teal);padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.badge-e{background:rgba(86,212,255,.15);color:var(--cyan);padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.badge-u{background:rgba(245,185,66,.15);color:var(--amber);padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.timeline{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.tl-step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.03)}
.mark-ok,.mark-wait,.mark-lock{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.mark-ok{background:rgba(46,230,200,.16);color:var(--teal)}
.mark-wait{background:rgba(245,185,66,.12);color:var(--amber)}
.mark-lock{background:rgba(255,107,128,.12);color:var(--danger)}
.auth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.auth-item{padding:14px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.03)}
.auth-item .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.auth-item .v{margin-top:6px;font-size:18px;font-weight:700}
.sec-flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.sec-node{padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);font-size:11px;font-weight:700;letter-spacing:.1em}
.sec-node.bad{border-color:rgba(255,107,128,.35);color:var(--danger)}
.sec-node.mid{border-color:rgba(245,185,66,.35);color:var(--amber)}
.sec-node.ok{border-color:rgba(46,230,200,.35);color:var(--teal)}
.audit-row{display:grid;grid-template-columns:120px 140px 1fr 110px;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.03);margin:8px 0}
.section-title{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.section-sub{color:var(--muted);margin-bottom:16px;font-size:14px}
.danger-card{border-color:rgba(255,107,128,.28)}
.safe-card{border-color:rgba(46,230,200,.22)}
.compare{margin-top:28px}
.compare h2{font-size:clamp(22px,3vw,32px);letter-spacing:-.03em;line-height:1.15;margin-bottom:16px;text-align:center}
.flow{display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:12px}
.flow .row{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--stroke)}
.nv{color:var(--amber);font-size:10px;letter-spacing:.12em;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.main>*{animation:fade .4s ease}
@media (prefers-reduced-motion:reduce){
  .dot,.main>*{animation:none}
  .btn{transition:none}
}
@media (min-width:1000px){
  .nav-toggle{display:none !important}
  .nav{display:flex !important;flex-direction:row;flex-wrap:nowrap;grid-column:auto}
  .nav-meta{grid-column:auto;justify-self:end;align-items:flex-end}
  .navbar{grid-template-columns:auto 1fr auto;border-radius:999px}
  .hero-grid{
    display:grid;
    grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr);
    gap:48px;
    align-items:center;
  }
  .stages{flex-wrap:nowrap}
  .arr{display:block}
  .status-strip,.features{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:999px){
  .navbar{grid-template-columns:1fr auto;border-radius:22px}
  .nav-toggle{display:grid;place-items:center;justify-self:end}
  .nav{display:none;grid-column:1/-1;flex-direction:column;align-items:stretch;flex-wrap:wrap}
  .navbar.open .nav{display:flex}
  .nav-meta{grid-column:1/-1;justify-self:stretch;align-items:flex-start}
  .hero-grid,.features,.status-strip,.ev-grid,.auth-grid,.grid2,.audit-row{grid-template-columns:1fr}
  .status-cell{border-right:none;border-bottom:1px solid var(--stroke)}
  .stages{flex-wrap:wrap}
  .arr{display:none}
}
@media (max-width:720px){
  .main,.nav-wrap{padding-left:16px;padding-right:16px}
  h1{font-size:32px}
}
</style>
</head>
<body>
<div class="shell">
<div class="nav-wrap">
  <header class="navbar" id="navbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
        <path d="M10 7.2h9.2c4.6 0 7.6 2.4 7.6 6.3 0 2.3-1.2 4.1-3.3 5.2 2.5.9 4 2.8 4 5.6 0 4.1-3.3 6.6-8.2 6.6H10V7.2zm4.9 9.5h4c2.2 0 3.5-1.1 3.5-2.8s-1.3-2.7-3.5-2.7h-4v5.5zm0 10.1h4.5c2.4 0 3.8-1.2 3.8-3s-1.4-2.9-3.8-2.9h-4.5v5.9z" fill="#2ee6c8"/>
        <path d="M25.2 5.1c.18 1.45-.4 2.7-1.45 3.45 1.05.18 2.05-.28 2.7-1.25.52 1.02.4 2.15-.02 2.95-.08-1.55.38-2.7 1.42-3.48-.95-.12-1.9.28-2.68 1.22.08-1.02.18-2.05.03-2.89z" fill="#56d4ff"/>
      </svg>
      <div>
        <div class="brand-name">BUYFIRE</div>
        <span class="brand-tag">COMMERCE WITH CONFIDENCE</span>
      </div>
    </div>
    <button class="nav-toggle" type="button" aria-label="Open navigation" onclick="document.getElementById('navbar').classList.toggle('open')">☰</button>

</div>

<script>
const API = location.port === "5173" ? "http://localhost:3847" : (location.origin.includes("3847") ? "" : "http://localhost:3847");
const SCREENS = ["landing","run","crash","repair","beforeafter","payment","security","audit"];
const NAV_LABELS = {landing:"LANDING",run:"RUN",crash:"CRASH",repair:"REPAIR",beforeafter:"BEFORE/AFTER",payment:"PAYMENT",security:"SECURITY",audit:"AUDIT"};
let state = { screen: "landing", mission: null, run1: null, run2: null, repair: null, plan: null, payment: null, paymentFail: null, security: null, audit: [], loading: false, error: null, merchant: "ForgeWorks Station" };

async function api(path, opts) {
  const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); }
  return r.json();
}

function nav(s) {
  state.screen = s;
  document.getElementById("navbar").classList.remove("open");
  render();
}

function chips(run) {
  const states = ["DISCOVER","UNDERSTAND","COMPARE","VERIFY","CART","CHECKOUT","COMPLETE"];
  if (!run) return states.map(s => `<div class="chip">${s}</div>`).join("");
  return states.map(s => {
    const reached = run.states.some(t => t.from === s || t.to === s);
    const blocked = run.states.some(t => t.from === s && t.to === "BLOCKED");
    let cls = "chip";
    if (blocked) cls += " blocked";
    else if (run.finalState === "COMPLETE" && (reached || s === "COMPLETE")) cls += " done";
    else if (reached && s !== "COMPLETE") cls += " done";
    const icon = blocked ? "✕ " : (cls.includes("done") ? "✓ " : "");
    return `<div class="${cls}">${icon}${s}</div>`;
  }).join("") + (run.finalState === "BLOCKED" ? `<div class="chip blocked">✕ BLOCKED</div>` : "");
}

function evidence(items) {
  if (!items || !items.length) return "";
  const icon = { match: "✓", blocked: "✕", warning: "⚠", info: "ℹ", mismatch: "✗" };
  return items.map(e => `<div class="ev ${e.type}"><span>${icon[e.type]||"•"}</span><div><strong>${e.label}</strong><div class="muted">${e.detail}</div></div></div>`).join("");
}

function isVerified() {
  return state.repair && state.repair.merchantVerification === "DEMO_SYNTHETIC_VERIFIED";
}

function commandStages() {
  const verified = isVerified();
  const items = [
    { n:"01", t:"BUYER INTENT", on: !!state.mission },
    { n:"02", t:"COMMERCE EVIDENCE", on: !!state.run1 },
    { n:"03", t:"PURCHASE BLOCKED", on: state.run1 && state.run1.finalState === "BLOCKED", halt: state.run1 && state.run1.finalState === "BLOCKED" && !state.run2 },
    { n:"04", t:"REPAIR GENERATED", on: !!state.repair },
    { n:"05", t:"VERIFICATION REQUIRED", on: !!state.repair && !verified, wait: !!state.repair && !verified },
    { n:"06", t:"VERIFIED", on: verified },
    { n:"07", t:"POLICY APPROVED", on: !!(state.plan && state.plan.approved) },
    { n:"08", t:"PAYMENT SIMULATION", on: !!state.payment }
  ];
  return `<div class="stage-rail">${items.map(i => `<div class="stn ${i.on?"on":""} ${i.halt?"halt":""} ${i.wait?"wait":""}">${i.n} ${i.t}</div>`).join("")}</div>`;
}

function statusStrip() {
  let agent = "READY", agentDot = "dot", agentDetail = "Buyer agent operational";
  if (state.loading) { agent = "RUNNING"; agentDot = "dot warn"; agentDetail = "Buyer state machine executing"; }
  else if (state.run2 && state.run2.finalState === "COMPLETE") { agent = "COMPLETE"; agentDetail = "Same mission completed after verification"; }
  else if (state.run1 && state.run1.finalState === "BLOCKED") { agent = "BLOCKED"; agentDot = "dot warn"; agentDetail = "Required evidence missing"; }
  const policy = state.plan ? (state.plan.approved ? "APPROVED" : "REJECTED") : "ENFORCED";
  const policyDetail = state.plan ? (state.plan.approved ? "Purchase plan passed deterministic checks" : "Purchase plan rejected") : "Deterministic checks active";
  const policyDot = state.plan && !state.plan.approved ? "dot danger idle" : "dot idle";
  const security = state.security ? "BLOCKED" : "ACTIVE";
  const secDetail = state.security ? "Instruction-like content intercepted" : "Injection & tamper protection";
  const secDot = state.security ? "dot warn idle" : "dot idle";
  return `<div class="status-strip">
    <div class="status-cell"><div class="k">Agent status</div><div class="v"><span class="${agentDot}"></span>${agent}</div><div class="d">${agentDetail}</div></div>
    <div class="status-cell"><div class="k">Policy</div><div class="v"><span class="${policyDot}"></span>${policy}</div><div class="d">${policyDetail}</div></div>
    <div class="status-cell"><div class="k">Payment</div><div class="v"><span class="dot idle"></span>SIMULATION</div><div class="d">No real money moved</div></div>
    <div class="status-cell"><div class="k">Security</div><div class="v"><span class="${secDot}"></span>${security}</div><div class="d">${secDetail}</div></div>
  </div>`;
}

function navMeta() {
  let title = "AGENT READY", dot = "dot";
  if (state.loading) { title = "AGENT RUNNING"; dot = "dot warn"; }
  else if (state.run2 && state.run2.finalState === "COMPLETE") title = "AGENT COMPLETE";
  else if (state.run1 && state.run1.finalState === "BLOCKED") { title = "AGENT BLOCKED"; dot = "dot warn"; }
  return `<div class="ready"><span class="${dot}"></span>${title}</div><div class="mode">SIMULATION MODE</div>`;
}

function ico(name) {
  const icons = {
    brain: '<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6"/></svg>',
    db: '<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="11" cy="7" rx="7" ry="3"/><path d="M4 7v8c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M4 11c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>',
    q: '<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M9 9.2c.4-1.2 3.4-1.4 3.4.4 0 1.5-1.7 1.6-1.7 3"/><circle cx="11" cy="15.6" r=".8" fill="currentColor" stroke="none"/></svg>',
    doc: '<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 5h7l4 4v9H7z"/><path d="M14 5v4h4M9 12h6M9 15h4"/></svg>',
    card: '<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="16" height="11" rx="2"/><path d="M3 10h16"/></svg>'
  };
  return icons[name];
}

async function startDemo() {
  state.loading = true; state.error = null; state.run1 = state.run2 = state.repair = state.plan = state.payment = state.paymentFail = state.security = null;
  render();
  try {
    const m = await api("/api/merchant"); state.merchant = m.name;
    state.mission = await api("/api/missions/generate", { method: "POST", body: JSON.stringify({ persona: "PRICE_HUNTER" }) });
    state.screen = "run"; render();
    state.run1 = await api("/api/buyer/run", { method: "POST", body: JSON.stringify({ mission: state.mission }) });
    state.screen = "crash"; state.loading = false;
    state.audit = await api("/api/audit");
    render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doRepair() {
  state.loading = true; render();
  try {
    state.repair = await api("/api/repair", { method: "POST", body: JSON.stringify({ run: state.run1 }) });
    state.screen = "repair"; state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doVerifyMerchant() {
  state.loading = true; render();
  try {
    state.repair = await api("/api/repair/verify-merchant", { method: "POST", body: JSON.stringify({ repair: state.repair }) });
    state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doRerun() {
  if (!state.repair || state.repair.merchantVerification !== "DEMO_SYNTHETIC_VERIFIED") {
    state.error = "Merchant verification required. GENERATED is not a merchant shipping promise.";
    render(); return;
  }
  state.loading = true; state.screen = "run"; render();
  try {
    state.run2 = await api("/api/buyer/run", { method: "POST", body: JSON.stringify({ mission: state.mission, isRepairedRun: true, repair: state.repair }) });
    state.screen = "beforeafter"; state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doPayment() {
  state.loading = true; render();
  try {
    state.plan = await api("/api/policy/evaluate", { method: "POST", body: JSON.stringify({
      amount: state.run2.cartTotal, currency: state.run2.currency || "INR", merchantId: state.run2.merchantId,
      productIds: state.run2.selectedProductIds, missionId: state.mission.id, runId: state.run2.runId
    })});
    if (state.plan.approved) {
      state.payment = await api("/api/payment/charge", { method: "POST", body: JSON.stringify({ plan: state.plan }) });
    }
    state.screen = "payment"; state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doPayFail() {
  state.loading = true; render();
  try {
    state.paymentFail = await api("/api/payment/charge", { method: "POST", body: JSON.stringify({ plan: state.plan, forceFail: true }) });
    state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function doSecurity() {
  state.loading = true; render();
  try {
    const res = await api("/api/security/scan", { method: "POST", body: JSON.stringify({ productId: "prod_malicious" }) });
    if (res.blocked) state.security = res.alert;
    state.screen = "security"; state.loading = false; state.audit = await api("/api/audit"); render();
  } catch (e) { state.error = e.message; state.loading = false; render(); }
}

async function showAudit() {
  state.audit = await api("/api/audit");
  state.screen = "audit"; render();
}

      </div>
    </div>
    <div class="page-foot"><span>BUYFIRE • AI COMMERCE AGENT</span><span>SAFER COMMERCE • A MORE OPEN INTERNET</span></div>`;
  }

  if (state.screen === "run") {
    h += `${commandStages()}
      <div class="section-title">AI Buyer ${state.loading?"in motion":"run"}</div>

    h += `${commandStages()}

  if (state.screen === "repair" && state.repair) {

    h += `${commandStages()}

      <div class="sim">DEMO / SYNTHETIC MERCHANT VERIFICATION — this is not real merchant data.</div>

  if (state.screen === "beforeafter") {
    h += `${commandStages()}

      <div class="section-sub">Same mission. Generated is not verified. Only verified evidence unblocks checkout.</div>
      <div class="grid2">
        <div class="card danger-card"><div class="card-title">Before</div><div class="state-rail">${chips(state.run1)}</div>
          ${state.run1?.finalState==="BLOCKED"?`<div class="alert"><div class="t">BLOCKED</div>${state.run1.blockedReason}</div>`:""}</div>
        <div class="card safe-card"><div class="card-title">After</div><div class="state-rail">${chips(state.run2)}</div>
          ${state.run2?.finalState==="COMPLETE"?`<div class="sim ok">COMPLETE — ₹${state.run2.cartTotal?.toLocaleString("en-IN")}</div>`:""}</div>
      </div>
      <button class="btn btn-primary" onclick="doPayment()" ${state.loading||!state.run2?"disabled":""}>Proceed to Checkout</button>`;
  }

  if (state.screen === "payment") {
    const idemCheck = state.plan && (state.plan.policyChecks||[]).find(c => /idempoten/i.test(c.rule||""));
    h += `${commandStages()}
      <div class="section-title">Authorization</div>
      <div class="section-sub">Policy engine → Authorization gate → Payment adapter</div>

    if (state.plan) {
      h += `<div class="card">
        <div class="card-title">Purchase plan</div>
        <div class="auth-grid">
          <div class="auth-item"><div class="k">Amount</div><div class="v">₹${state.plan.amount.toLocaleString("en-IN")}</div></div>

          <div class="auth-item"><div class="k">Merchant</div><div class="v" style="font-size:16px">${state.merchant}</div></div>
          <div class="auth-item"><div class="k">Policy</div><div class="v" style="color:${state.plan.approved?"var(--teal)":"var(--danger)"}">${state.plan.approved?"APPROVED":"REJECTED"}</div></div>
          <div class="auth-item"><div class="k">Idempotency</div><div class="v" style="font-size:15px">${idemCheck ? (idemCheck.passed ? "VERIFIED" : "FAILED") : "ISSUED"}</div></div>
          <div class="auth-item"><div class="k">Plan</div><div class="v" style="font-size:13px;font-family:var(--mono)">${state.plan.planId.slice(0,8)}…</div></div>

    if (state.payment) h += `<div class="card"><div class="card-title">Payment Result</div><p><strong>${state.payment.status}</strong> via ${state.payment.adapter}</p><p class="muted">${state.payment.message}</p></div>`;

      <button class="btn btn-ghost" onclick="doSecurity()">Run Security Attack Demo</button>
      <button class="btn btn-ghost" onclick="showAudit()">View Audit Trail</button>`;

  if (state.screen === "security") {

    h += `${commandStages()}
      <div class="section-title">Audit trail</div>
      <div class="section-sub">Every important action produces an event. Secrets are never logged.</div>

  }

  a.innerHTML = h;
}
render();
